name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smoothflow-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch pinned RIFE source and submodules
        run: |
          mkdir -p third_party
          git clone https://github.com/nihui/rife-ncnn-vulkan.git third_party/rife-ncnn-vulkan
          git -C third_party/rife-ncnn-vulkan checkout a7532fc3f9f8f008cd6eecd6f2ffe2a9698e0cf7
          git -C third_party/rife-ncnn-vulkan submodule sync --recursive
          git -C third_party/rife-ncnn-vulkan submodule update --init --recursive

      - name: Expose RIFE inference core to JNI
        run: python3 scripts/patch_rife_cmake.py third_party/rife-ncnn-vulkan/src

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SmoothFlow latest APK
          body: |
            Automated debug APK build. Install only on a compatible 64-bit ARM Android device.
            RIFE model files are downloaded by the app on first use.
          prerelease: true
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoothflow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
